version: '3.9'

services:
  # ── Aplicação Laravel ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kontratgest-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=kontratgest
      - DB_USERNAME=kontratgest
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=null
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kontratgest-network

  # ─── Base de Dados PostgreSQL ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kontratgest-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kontratgest-dev
      POSTGRES_USER: eric-dev
      POSTGRES_PASSWORD: gc65THxcJpmWu.w.fU7ccEts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eric-dev -d kontratgest-dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kontratgest-network

  # ─── Redis (Cache & Filas) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kontratgest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kontratgest-network

  # ── Adminer (Opcional - Gestão DB via Web) ────────────
  adminer:
    image: adminer:latest
    container_name: kontratgest-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - kontratgest-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kontratgest-network:
    driver: bridge