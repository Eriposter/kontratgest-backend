version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kontratgest-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=95.216.170.237        # ← IP Remoto
      - DB_PORT=5432
      - DB_DATABASE=kontratgest-dev
      - DB_USERNAME=eric-dev
      - DB_PASSWORD=gc65THxcJpmWu.w.fU7ccEts
    # Remove a secção 'depends_on' pois já não dependes do postgres local
    networks:
      - kontratgest-network

networks:
  kontratgest-network:
    driver: bridge


  # ── Adminer (Opcional - Gestão DB via Web) ────────────
  adminer:
    image: adminer:latest
    container_name: kontratgest-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - kontratgest-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kontratgest-network:
    driver: bridge